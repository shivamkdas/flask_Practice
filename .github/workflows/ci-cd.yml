name: Flask CI/CD

on:
  push:
    branches:
      - main
      - staging
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          MONGO_URI: mongodb://localhost:27017/test_student_db
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application
        run: |
          mkdir -p build
          cp -r app.py templates requirements.txt start_flask.sh build/
          echo "Build completed successfully."
          ls -la build/

  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to staging
        run: echo "Flask application deployed to staging."

  deploy-production:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production
        run: echo "Flask application deployed to production.""
